<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title> A Simple Webpage </title>
</head>
<body>
    <h2>Hello World</h2>
    <p class="p">First Hello World!</p>
    <p class="p">Second Hello World! </p>
    <script>
        const pEl = document.getElementsByClassName("p");
        Array(...pEl).forEach(function(p){
            p.innerHTML = "To All, \"Hello\""
        })
    </script>
</body>
</html>
