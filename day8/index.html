<!DOCTYPE html>
<html lang='en'>
<head>
    <title> Project Character Counter </title>
    <style>

        *{
            margin: 0;
            max-width: 80vw;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }

        h1 {
            color: teal;
            text-align: center;
            padding: 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        p {
            font-family: Tahoma, Sans-serif;
            font-weight: 700;
            text-indent: 20px;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            height: auto;
            font-size: large;
        }

        #calcBtn {
            background-color: teal;
            color: #eee;
            border-radius: 10px;
            border: none;
            padding: 10px;
            margin: 4px;
        }

        #calcBtn:active {
            background-color: rgb(100, 128, 128);
        }

    </style>
</head>
<body>
    <h1> Character Counter </h1>
    <p> Type text in the box below, click the button below and it tells you the number of characters your text contains. E.g "I am a Person" contains 13 letters (Spaces included). </p>
    <textarea>Hello</textarea>
    <button id='calcBtn'>Count</button>
    <p id="message"> Letters: 0 </p>
</body>
</html>
